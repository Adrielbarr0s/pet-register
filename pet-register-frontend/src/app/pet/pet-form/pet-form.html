<mat-toolbar color="primary">
  {{ id ? 'Editar Pet' : 'Cadastrar Novo Pet' }}
</mat-toolbar>

<div style="padding: 20px;">
  <form [formGroup]="form" (ngSubmit)="salvar()" autocomplete="off" novalidate>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="nome" required>
      <mat-error *ngIf="form.get('nome')?.hasError('required')">Nome é obrigatório.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Espécie</mat-label>
      <input matInput formControlName="especie" required>
      <mat-error *ngIf="form.get('especie')?.hasError('required')">Espécie é obrigatória.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Idade</mat-label>
      <input matInput type="number" formControlName="idade" required>
      <mat-error *ngIf="form.get('idade')?.hasError('required')">Idade é obrigatória.</mat-error>
      <mat-error *ngIf="form.get('idade')?.hasError('min')">Idade não pode ser negativa.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="full-width">
      <mat-label>Tutor</mat-label>
      <input matInput formControlName="tutor" required>
      <mat-error *ngIf="form.get('tutor')?.hasError('required')">Tutor é obrigatório.</mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="salvando || form.invalid">
      {{ salvando ? 'Salvando...' : 'Salvar' }}
    </button>
    <button mat-button routerLink="/" type="button">Cancelar</button>
  </form>
</div>
